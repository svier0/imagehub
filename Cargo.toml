[package]
name = "imagehub"
version = "0.1.0"
edition = "2024"


[dependencies]
reqwest = { version = "0.12", features = ["blocking", "multipart"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
percent-encoding = "2"
md5 = "0.7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "imagehub"
version = "0.3.2"
edition = "2024"
description = "CLI tool and library for managing imagehub.cc account images"
license = "MIT"


[dependencies]
reqwest = { version = "0.12", features = ["blocking", "multipart", "rustls-tls"], default-features = false }
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
md5 = "0.7"
dirs = "6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
